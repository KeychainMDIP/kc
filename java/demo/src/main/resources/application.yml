keymaster:
  gatekeeperUrl: http://localhost:4224
  registry: hyperswarm
  didPrefix: ${KEYMASTER_DID_PREFIX:did:test}
  gatekeeperCallTimeout: ${KEYMASTER_GATEKEEPER_CALL_TIMEOUT:60s}
  walletDir: data
  walletFile: wallet.json

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080

vaadin:
  liveReload:
    enabled: true
  whitelisted-packages: com.vaadin,org.keychain.demo
