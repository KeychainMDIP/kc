name: Java tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'java/**'
      - '.github/workflows/java-test.yml'
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Run offline tests
        run: ./gradlew --no-daemon test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            java/**/build/test-results/test/*.xml
            java/**/build/reports/tests/test/**
          if-no-files-found: ignore
