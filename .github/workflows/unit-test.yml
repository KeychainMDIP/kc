name: unit-test

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KC_SEARCH_TEST_POSTGRES_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.23.4'

    - name: Install dependencies
      run: npm install

    - name: Install Search Server test dependencies
      run: npm ci --prefix services/search-server

    - name: Install Explorer test dependencies
      run: npm ci --prefix services/explorer

    - name: Compile TypeScript
      run: npm run build

    - name: Type-check tests
      run: npm run typecheck

    - name: Run ESLint
      run: npm run lint

    - name: Run unit tests
      run: npm test

    - name: Generate Code Coverage report
      id: code-coverage
      uses: barecheck/code-coverage-action@v1
      with:
        barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
        lcov-file: "./coverage/lcov.info"
        send-summary-comment: true
        show-annotations: "warning"

    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@v2.3.6
